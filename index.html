<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Febby Anggun Manis ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            overflow-y: auto; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            touch-action: manipulation;
        }

        .font-handwriting { font-family: 'Dancing Script', cursive; }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .heart-beat { animation: heartbeat 2s infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px 0 rgba(255, 105, 180, 0.2);
        }

        .hidden-opacity { opacity: 0; pointer-events: none; transition: opacity 1s ease; display: none; }
        .visible-opacity { opacity: 1; pointer-events: auto; transition: opacity 1s ease; display: flex; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }
        .pulse-alert {
            animation: pulse-red 2s infinite;
            border: 2px solid #ef4444 !important;
        }
        
        .text-gradient {
            background: linear-gradient(to right, #ec4899, #d946ef, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 4px solid white;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        /* --- STYLE BARU UNTUK GALLERY MARQUEE --- */
        .marquee-container {
            width: 100vw; /* Full width layar */
            margin-left: -50vw; /* Trik agar full width meski parent ada padding */
            left: 50%;
            position: relative;
            overflow: hidden;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(255, 255, 255, 0.3); /* Sedikit background agar foto standout */
            backdrop-filter: blur(5px);
        }

        .marquee-track {
            display: flex;
            gap: 15px; /* Jarak antar foto */
            width: max-content;
        }

        /* Foto Setup */
        .marquee-item {
            height: 160px; /* Tinggi Konsisten Mobile */
            width: auto;   /* Lebar otomatis */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        @media (min-width: 768px) {
            .marquee-item { height: 200px; } /* Tinggi Konsisten Desktop */
        }

        .marquee-item:hover {
            transform: scale(1.05); /* Efek zoom dikit pas hover */
            z-index: 10;
        }

        /* Animasi Jalan */
        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } /* Geser setengah panjang track (karena diduplikasi) */
        }

        @keyframes scrollRight {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* Kecepatan Animasi */
        .animate-scroll-left {
            animation: scrollLeft 40s linear infinite; /* 40s agar smooth tidak pusing */
        }
        
        .animate-scroll-right {
            animation: scrollRight 40s linear infinite;
        }
        
        /* Pause pas di hover mouse (opsional, biar enak dilihat) */
        .marquee-track:hover {
            animation-play-state: paused;
        }

    </style>
</head>
<body class="min-h-screen w-full relative">

    <audio id="bgMusic" loop preload="auto">
        <source src="https://feeldreams.github.io/audio/thousand.mp3" type="audio/mpeg">

    <button id="musicToggle" onclick="toggleMusic()" class="fixed top-4 left-4 z-[60] bg-white/90 p-3 rounded-full shadow-lg text-pink-600 text-sm hover:bg-white transition flex items-center gap-2 border border-pink-200">
        <span id="musicIcon">🔇</span> 
        <span id="musicText" class="hidden md:inline">Play</span>
    </button>

    <div id="openingScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-pink-50 transition-all duration-1000 h-screen w-screen">
        <div class="text-center p-8 bg-white/60 backdrop-blur-md rounded-3xl shadow-2xl border border-white/60 max-w-sm mx-4 transform transition-all hover:scale-105">

            <h1 class="text-2xl font-bold text-pink-600 mb-2">Halo, Manis!</h1>
            <p class="text-gray-600 mb-8 text-sm px-2 font-medium">Ada kejutan spesial buat kamu.<br>Siap-siap ya...</p>
            <button onclick="startExperience()" class="bg-gradient-to-r from-pink-500 via-rose-500 to-purple-500 text-white px-10 py-4 rounded-full font-bold text-lg shadow-xl transform hover:scale-110 transition duration-300 ring-4 ring-pink-100 active:scale-95">
                Buka Sekarang 🌹

        </div>
    </div>

    <div id="mainContent" class="hidden-opacity w-full min-h-screen flex-col items-center justify-start py-12 px-4 gap-8">
        
        <div class="glass-card max-w-md w-full rounded-[2rem] p-6 md:p-8 text-center relative transform transition-all duration-500 mt-4">
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2">
                <div class="bg-white p-3 rounded-full shadow-lg">
                    <span class="text-5xl animate-pulse">💖</span>
                </div>
            </div>

            <div class="mt-8">
                <h2 class="text-3xl font-handwriting text-pink-500 mb-2 font-bold drop-shadow-sm transform -rotate-2">
                    Happy Valentine!
                </h2>
                <h1 class="text-2xl md:text-3xl font-black mb-6 tracking-wide text-gradient uppercase leading-tight">
                    FEBBY ANGGUN MANIS<br>💗💗💗

            </div>

            <div class="h-[120px] flex items-center justify-center px-4 mb-6 bg-pink-50/50 rounded-2xl border border-pink-100">
                <p id="typingText" class="text-gray-700 font-semibold text-lg leading-relaxed font-handwriting"></p>
            </div>

            <div class="flex gap-3 w-full justify-center mt-2">
                <button onclick="giveItem('cokelat')" class="w-1/2 bg-gradient-to-r from-amber-700 to-amber-600 hover:from-amber-800 hover:to-amber-700 text-white py-3 rounded-2xl transition shadow-lg flex justify-center items-center gap-2 transform active:scale-95 border-b-4 border-amber-900">
                    <span class="text-2xl">🍫</span> <span class="font-bold">Mau Cokelat</span>
                </button>
                <button onclick="giveItem('bunga')" class="w-1/2 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white py-3 rounded-2xl transition shadow-lg flex justify-center items-center gap-2 transform active:scale-95 border-b-4 border-pink-700">
                    <span class="text-2xl">🌼</span> <span class="font-bold">Mau Bunga</span>
                </button>
            </div>
            <div id="responseMsg" class="mt-4 text-sm font-bold text-pink-600 h-6 transition-opacity duration-300 opacity-0"></div>
        </div>

        <div class="w-full max-w-xs md:max-w-sm mx-auto z-10">
            <h3 class="text-center text-pink-600 font-bold mb-3 font-handwriting text-2xl">Tonton ini ya cantik... 🎥</h3>
            
            <div class="video-wrapper">
                <video controls loop playsinline>
                    <source src="Valentine's Day 2026_20260215_003936_0000.mp4" type="video/mp4">
                    Browser kamu tidak mendukung pemutar video ini.
                </video>
            </div>
        </div>

        <div class="w-full mt-4 mb-4">
            <h3 class="text-center text-pink-600 font-bold mb-4 font-handwriting text-2xl">Kenangan Kita 📸</h3>
            
            <div class="marquee-container">
                <div class="marquee-track animate-scroll-left">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                    <img src="foto1.jpg" class="marquee-item" alt="Foto 1"><img src="foto2.jpg" class="marquee-item" alt="Foto 2"><img src="foto3.jpg" class="marquee-item" alt="Foto 3">
                </div>

                <div class="marquee-track animate-scroll-right">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                    <img src="foto4.jpg" class="marquee-item" alt="Foto 4"><img src="foto5.jpg" class="marquee-item" alt="Foto 5"><img src="foto6.jpg" class="marquee-item" alt="Foto 6">
                </div>

                <div class="marquee-track animate-scroll-left">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                    <img src="foto7.jpg" class="marquee-item" alt="Foto 7"><img src="foto8.jpg" class="marquee-item" alt="Foto 8"><img src="foto9.jpg" class="marquee-item" alt="Foto 9">
                </div>
            </div>
        </div>
        <footer class="text-pink-600/80 text-xs font-bold glass-card px-6 py-3 rounded-full shadow-sm mt-4 mb-8">
            Dibuat dengan ❤️ Spesial untuk Febby
        </footer>
    </div>

    <script>
        const recipientName = "Febby Anggun Manis"; 
        const messages = [
            "Hai, Febby Anggun yang Manis...", 
            "Kerasa banget ngga sih 11 tahun perjalanan kita ini? 😅",
            "Terima kasih sudah menjadi sosok yang sangat",
            "menginspirasi dan menguatkan ditiap hari. 🗓",
            "Dunia ku yang abu-abu jadi lebih berwarna",
            "karena kehadiran dan pesona manismu. 😊",
            "Semoga sukak dengan effort sederhanaku ini! 🌹",
            "Jangan pernah bosen untuk sehat dan bahagia selalu! 💞"
        ];
        
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggle');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');

        function fireConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
            }
            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff0000', '#ff69b4'] });
            fire(0.2, { spread: 60, colors: ['#00ff00', '#0000ff'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        function flowerConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff69b4', '#ff1493', '#db7093'], shapes: ['circle'] });
        }

        function startExperience() {
            bgMusic.volume = 1.0;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => updateMusicUI(true)).catch(error => { updateMusicUI(false); musicBtn.classList.add('pulse-alert'); });
            }
            const screen = document.getElementById('openingScreen');
            screen.style.opacity = '0';
            screen.style.pointerEvents = 'none';
            setTimeout(() => {
                screen.style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden-opacity');
                document.getElementById('mainContent').classList.add('visible-opacity');
                fireConfetti();
                setTimeout(fireConfetti, 500); 
                typeWriter();
            }, 800);
        }

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); updateMusicUI(true); musicBtn.classList.remove('pulse-alert'); } 
            else { bgMusic.pause(); updateMusicUI(false); }
        }

        function updateMusicUI(isPlaying) {
            if (isPlaying) { musicIcon.innerText = "🎵"; musicText.innerText = "Play"; musicBtn.classList.add('bg-pink-100'); musicBtn.classList.remove('bg-white/90', 'pulse-alert'); } 
            else { musicIcon.innerText = "🔇"; musicText.innerText = "Stop"; musicBtn.classList.remove('bg-pink-100'); musicBtn.classList.add('bg-white/90'); }
        }

        let msgIndex = 0, charIndex = 0, isDeleting = false;
        const typingElement = document.getElementById('typingText');

        function typeWriter() {
            if (msgIndex >= messages.length) return;
            const currentMsg = messages[msgIndex];
            const speed = isDeleting ? 30 : 80;
            
            if (isDeleting) { typingElement.innerHTML = currentMsg.substring(0, charIndex - 1); charIndex--; } 
            else { typingElement.innerHTML = currentMsg.substring(0, charIndex + 1); charIndex++; }

            let nextSpeed = speed;
            if (!isDeleting && charIndex === currentMsg.length) {
                if (msgIndex === messages.length - 1) return; 
                isDeleting = true; nextSpeed = 1500;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false; msgIndex++; nextSpeed = 400;
            }
            setTimeout(typeWriter, nextSpeed);
        }

        function giveItem(item) {
            const responseMsg = document.getElementById('responseMsg');
            if (navigator.vibrate) navigator.vibrate(200);
            if(item === 'cokelat') {
                responseMsg.innerText = "Manis banget, makasih ya! 🍫😋";
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#8B4513', '#D2691E', '#FFD700'] });
            } else {
                responseMsg.innerText = "Waaaah bunganya cantik! 🌺🥺";
                flowerConfetti();
            }
            responseMsg.style.opacity = '1';
            setTimeout(() => responseMsg.style.opacity = '0', 3000);
        }
    </script>
</body>
</html>
